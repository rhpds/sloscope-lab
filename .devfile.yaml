schemaVersion: 2.2.0
metadata:
  name: sloscope-lab
  displayName: sloscope-lab - Publishing House Workspace
  description: Workspace for creating RHDP lab/demo content with Claude AI assistance
attributes:
  che-code.eclipse.org/vscode-preferences:
    security.workspace.trust.enabled: false

components:
  - name: dev-tools
    container:
      image: quay.io/devfile/universal-developer-image:latest
      memoryLimit: 4Gi
      memoryRequest: 2Gi
      cpuLimit: 2000m
      cpuRequest: 1000m
      mountSources: true
      sourceMapping: /projects
      env:
        - name: DEFAULT_EXTENSIONS
          value: '/tmp/claude-code.vsix'
        - name: CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS
          value: '1'

commands:
  - id: setup-workspace
    exec:
      component: dev-tools
      commandLine: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import ssl
        import sys
        import tempfile
        from urllib.request import Request, HTTPSHandler, HTTPRedirectHandler, build_opener

        CENTRAL_URL = "https://central-api-publishing-house.apps.ocpv-infra02.wdc07.infra.demo.redhat.com"

        class NoRedirect(HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                return None

        def setup():
            # This authoring credential is distinct from each learner allocation's model Secret.
            auth_dir = Path.home() / ".config" / "publishing-house"
            auth_file = auth_dir / "auth.json"
            if auth_dir.is_symlink() or auth_file.is_symlink():
                raise ValueError("Credential paths must not be symbolic links")
            auth_dir.mkdir(parents=True, exist_ok=True, mode=0o700)
            auth_dir.chmod(0o700)
            if auth_file.exists():
                auth_file.chmod(0o600)
                existing = json.loads(auth_file.read_text())
                if all(isinstance(existing.get(k), str) and existing[k].strip()
                       for k in ("credential", "litellm_key", "litellm_endpoint", "litellm_model")):
                    print("Workspace auth already configured")
                    return

            # Use system trust, or an explicitly supplied enterprise CA bundle. No TLS bypass.
            context = ssl.create_default_context(cafile=os.environ.get("PH_CA_BUNDLE") or None)
            opener = build_opener(HTTPSHandler(context=context), NoRedirect())
            def post(path, bearer, payload=None):
                request = Request(CENTRAL_URL + path, method="POST",
                    data=json.dumps(payload).encode() if payload is not None else b"",
                    headers={"Authorization": "Bearer " + bearer, "Content-Type": "application/json"})
                # HTTP, TLS and redirect errors abort setup. Never echo response bodies or keys.
                with opener.open(request, timeout=30) as response:
                    return json.load(response)

            token = Path("/var/run/secrets/kubernetes.io/serviceaccount/token").read_text().strip()
            if not token:
                raise ValueError("Missing workspace identity")
            identity = post("/api/v1/auth/keys/anonymous", token)
            api_key = identity.get("api_key")
            if not isinstance(api_key, str) or not api_key.strip():
                raise ValueError("Missing PH credential")
            model = post("/api/v1/litellm/keys/generate", api_key, {"project_id": "sloscope-lab"})
            fields = ("litellm_key", "litellm_endpoint", "litellm_model")
            if not all(isinstance(model.get(k), str) and model[k].strip() for k in fields):
                raise ValueError("Incomplete model configuration")
            config = {"credential": api_key, "central": CENTRAL_URL, **{k: model[k] for k in fields}}
            temp_name = None
            try:
                with tempfile.NamedTemporaryFile(mode="w", dir=auth_dir, prefix=".auth-", delete=False) as tmp:
                    temp_name = tmp.name
                    os.fchmod(tmp.fileno(), 0o600)
                    json.dump(config, tmp, indent=2)
                    tmp.write("\n")
                    tmp.flush()
                    os.fsync(tmp.fileno())
                os.replace(temp_name, auth_file)
            finally:
                if temp_name and os.path.exists(temp_name):
                    os.unlink(temp_name)
            print("Workspace auth configured")

        if __name__ == "__main__":
            try:
                setup()
            except Exception:
                print("Workspace auth setup failed; check trusted CA, PH access and workspace identity. No credential was installed.", file=sys.stderr)
                sys.exit(1)
        PY
      workingDir: /projects
      label: "Setup Workspace Auth"
      group:
        kind: build
        isDefault: false

  - id: install-deps
    exec:
      component: dev-tools
      commandLine: |
        command -v python3 >/dev/null 2>&1 || sudo dnf install -y python3 2>/dev/null
        command -v pip3 >/dev/null 2>&1 || python3 -m ensurepip --user 2>/dev/null || sudo dnf install -y python3-pip 2>/dev/null
        PROJECT_DIR=$(ls -d /projects/*/ 2>/dev/null | head -1)
        if [ -f "${PROJECT_DIR}publishing-house/tools/requirements.txt" ]; then
          pip3 install --user -r "${PROJECT_DIR}publishing-house/tools/requirements.txt" 2>/dev/null || echo "WARNING: could not install Python dependencies"
        fi
      workingDir: /projects
      label: "Install Python dependencies"
      group:
        kind: build
        isDefault: false

  - id: install-claude
    exec:
      component: dev-tools
      commandLine: |
        if [ ! -f /home/user/.local/bin/claude ]; then
          mkdir -p /home/user/.local/bin
          curl -fsSL https://github.com/anthropics/claude-code/releases/download/v2.1.207/claude-linux-x64.tar.gz -o /tmp/claude.tar.gz
          tar -xzf /tmp/claude.tar.gz -C /home/user/.local/bin claude
          chmod +x /home/user/.local/bin/claude
          rm /tmp/claude.tar.gz
        fi
      workingDir: /projects
      label: "Install Claude CLI"
      group:
        kind: build
        isDefault: false

  - id: setup-env-script
    exec:
      component: dev-tools
      commandLine: |
        AUTH_FILE=/home/user/.config/publishing-house/auth.json
        mkdir -p /home/user/.local/bin /home/user/.claude

        # apiKeyHelper script (reads API key from auth.json)
        cat > /home/user/.local/bin/claude-api-key-helper.sh << 'HELPEREOF'
        #!/bin/bash
        AUTH_FILE=/home/user/.config/publishing-house/auth.json
        if [ -f "$AUTH_FILE" ]; then
          python3 -c "import json; print(json.load(open('$AUTH_FILE')).get('litellm_key',''))" 2>/dev/null
        fi
        HELPEREOF
        chmod +x /home/user/.local/bin/claude-api-key-helper.sh

        # Configure Claude Code (CLI + extension) via settings.json
        if [ -f "$AUTH_FILE" ]; then
          LITELLM_URL=$(python3 -c "import json; print(json.load(open('$AUTH_FILE')).get('litellm_endpoint',''))" 2>/dev/null)
          LITELLM_MODEL=$(python3 -c "import json; print(json.load(open('$AUTH_FILE')).get('litellm_model',''))" 2>/dev/null)
          cat > /home/user/.claude/settings.json << SETTINGSEOF
        {
          "apiKeyHelper": "/home/user/.local/bin/claude-api-key-helper.sh",
          "env": {
            "ANTHROPIC_BASE_URL": "${LITELLM_URL}",
            "ANTHROPIC_MODEL": "${LITELLM_MODEL}"
          },
          "permissions": {
            "allow": [
              "Bash(python*)",
              "Bash(python3*)",
              "Bash(pip*)",
              "Bash(git *)",
              "Bash(command -v *)",
              "Bash(curl *)",
              "Bash(cat *)",
              "Bash(ls *)",
              "Bash(mkdir *)",
              "Bash(cd *)",
              "Bash(grep *)",
              "Bash(find *)",
              "Bash(head *)",
              "Bash(tail *)",
              "Bash(wc *)",
              "Read(*)",
              "Edit(publishing-house/*)",
              "Write(publishing-house/*)",
              "Edit(catalog-info.yaml)"
            ]
          }
        }
        SETTINGSEOF
        else
          cat > /home/user/.claude/settings.json << 'SETTINGSEOF'
        {
          "apiKeyHelper": "/home/user/.local/bin/claude-api-key-helper.sh",
          "permissions": {
            "allow": [
              "Bash(python*)",
              "Bash(python3*)",
              "Bash(pip*)",
              "Bash(git *)",
              "Bash(command -v *)",
              "Bash(curl *)",
              "Bash(cat *)",
              "Bash(ls *)",
              "Bash(mkdir *)",
              "Bash(cd *)",
              "Bash(grep *)",
              "Bash(find *)",
              "Bash(head *)",
              "Bash(tail *)",
              "Bash(wc *)",
              "Read(*)",
              "Edit(publishing-house/*)",
              "Write(publishing-house/*)",
              "Edit(catalog-info.yaml)"
            ]
          }
        }
        SETTINGSEOF
        fi
      workingDir: /projects
      label: "Setup environment script"
      group:
        kind: build
        isDefault: false

  - id: install-skills
    exec:
      component: dev-tools
      commandLine: |
        SKILL_DIR=/home/user/.claude/skills/publishing-house
        mkdir -p /home/user/.claude/skills
        if [ ! -d "$SKILL_DIR" ]; then
          git clone -b prod https://github.com/rhpds/rhdp-publishing-house-skills.git "$SKILL_DIR" >/dev/null 2>&1 \
            || echo "WARNING: could not install skills"
        fi
      workingDir: /home/user
      label: "Install Publishing House Skills"
      group:
        kind: build
        isDefault: false


  - id: download-claude-extension
    exec:
      component: dev-tools
      commandLine: |
        curl -sL -o /tmp/claude-code.vsix "https://open-vsx.org/api/Anthropic/claude-code/linux-x64/2.1.220/file/Anthropic.claude-code-2.1.220@linux-x64.vsix"
      workingDir: /projects
      label: "Download Claude Code Extension"
      group:
        kind: build
        isDefault: false

events:
  postStart:
    - download-claude-extension
    - install-deps
    - install-claude
    - setup-workspace
    - setup-env-script
    - install-skills
