<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img" aria-labelledby="title desc"><title id="title">SLOscope: evidence flow to a human decision</title><desc id="desc">A reference baseline and comparison evidence feed separate target and drift review paths; live later windows and synthetic fixture edits are labeled separately. Evidence constraints can reject interpretation. A human decides next steps; exported artifacts are previews, not deployments.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#555"/></marker></defs><rect width="1100" height="1060" fill="white"/><text x="30" y="36" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">SLOscope: evidence flow to a human decision</text><text x="30" y="66" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Core: synthetic inputs and deterministic review. Optional model calls are labeled; rollout is separate.</text><text x="30" y="112" fill="#b00000" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">TARGET-REVIEW PATH</text><text x="580" y="112" fill="#b00000" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">DRIFT-REVIEW PATH</text><rect x="30" y="135" width="490" height="100" rx="4" fill="#f7f7f7" stroke="#777"/><text x="48" y="164" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">1. Identified telemetry evidence</text><text x="48" y="191" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Service + namespace + window + reported coverage</text><text x="48" y="214" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Live collector, or explicitly synthetic training fixture</text><rect x="580" y="135" width="490" height="100" rx="4" fill="#f7f7f7" stroke="#777"/><text x="598" y="164" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Comparison evidence</text><text x="598" y="191" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Live: later window, same service and namespace</text><text x="598" y="214" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Lab: edited error count, original query window</text><rect x="30" y="295" width="490" height="105" rx="4" fill="#f7f7f7" stroke="#777"/><text x="48" y="324" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">2. Compute and preserve baseline</text><text x="48" y="351" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Deterministic indicators; reference digest retained</text><text x="48" y="374" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Preserve the reference before evaluating change</text><rect x="580" y="295" width="490" height="105" rx="4" fill="#f7f7f7" stroke="#777"/><text x="598" y="324" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">3. Compare with the reference</text><text x="598" y="351" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Deterministic deviations and tolerance-band breaches</text><text x="598" y="374" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">A drift breach is not automatically an SLO miss</text><polyline points="275,235 275,295" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polyline points="825,235 825,295" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polyline points="520,347 580,347" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="528" y="332" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">ref.</text><rect x="30" y="470" width="490" height="135" rx="4" fill="#f7f7f7" stroke="#777"/><text x="48" y="499" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">4a. Optional model target proposal</text><text x="48" y="526" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Coverage checked before a model request</text><text x="48" y="549" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Proposed targets checked against baseline evidence</text><text x="48" y="572" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Training export uses a labeled recorded example</text><rect x="580" y="470" width="490" height="135" rx="4" fill="#f7f7f7" stroke="#777"/><text x="598" y="499" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">4b. Check drift, then optional interpretation</text><text x="598" y="526" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Insufficient / conflicting evidence: abstain</text><text x="598" y="549" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Admissible signal: optional advisory classification</text><text x="598" y="572" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">The training review does not call a model</text><polyline points="275,400 275,470" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><polyline points="825,400 825,470" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="685" width="1040" height="115" rx="4" fill="#f7f7f7" stroke="#777"/><text x="48" y="714" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">5. Human review: evidence + business context + accountable owner</text><text x="48" y="741" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">What changed? What remains unknown? Investigate, gather evidence, or review a target.</text><text x="48" y="764" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">A model explanation does not prove cause. An artifact does not approve a release or customer commitment.</text><polyline points="275,605 275,685" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polyline points="825,605 825,685" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="875" width="490" height="105" rx="4" fill="#f7f7f7" stroke="#777"/><text x="48" y="904" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">6. Qualified export preview</text><text x="48" y="931" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Match observed histogram boundaries and identity</text><text x="48" y="954" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">OpenSLO / Prometheus artifacts require further tests</text><rect x="580" y="875" width="490" height="105" rx="4" fill="#f7f7f7" stroke="#777" stroke-dasharray="8 5"/><text x="598" y="904" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Separate operational approval</text><text x="598" y="931" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Qualify live metrics and alert firing / recovery</text><text x="598" y="954" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">An owner approves any rollout; no auto-remediation</text><polyline points="275,800 275,875" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polyline points="520,927 580,927" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="30" y="1025" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Reading order: learn the concepts, inspect evidence, test the boundary, then write the owner-facing recommendation.</text></svg>
