<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1090" viewBox="0 0 1100 1090" role="img" aria-labelledby="title desc"><title id="title">SLOscope: training workspace and proposed RHDP live infrastructure</title><desc id="desc">The executable synthetic training workspace has a browser guide, terminal, pinned Python engine, local artifacts, and optional stdio MCP process. A distinct proposed live OpenShift environment adds sample service, metrics, collector/API, storage and model access. RHDP provisioning is pending.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#555"/></marker></defs><rect width="1100" height="1090" fill="white"/><text x="30" y="36" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">SLOscope: training workspace and proposed RHDP live infrastructure</text><text x="30" y="66" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Runnable tools are shown above. RHDP provisioning and the live extension are not yet accepted.</text><rect x="25" y="95" width="1050" height="450" rx="4" fill="white" stroke="#aaa"/><text x="41" y="125" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">A. Runnable training arrangement; RHDP terminal hosting is still proposed</text><rect x="55" y="155" width="240" height="105" rx="4" fill="#f7f7f7" stroke="#777"/><text x="73" y="184" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Learner browser</text><text x="73" y="211" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Classic Showroom guide</text><text x="73" y="234" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">No telemetry collection here</text><rect x="370" y="155" width="285" height="105" rx="4" fill="#f7f7f7" stroke="#777"/><text x="388" y="184" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Terminal workspace</text><text x="388" y="211" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Pinned Python 3.11 source</text><text x="388" y="234" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Isolated virtual environment</text><rect x="735" y="155" width="305" height="105" rx="4" fill="#f7f7f7" stroke="#777"/><text x="753" y="184" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Python engine + API checks</text><text x="753" y="211" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Baseline, drift, constraints</text><text x="753" y="234" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">HTTP handlers tested in process</text><polyline points="295,207 370,207" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="192" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">read / do</text><polyline points="655,207 735,207" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="666" y="192" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">calls</text><rect x="55" y="350" width="240" height="115" rx="4" fill="#f7f7f7" stroke="#777"/><text x="73" y="379" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Optional MCP client</text><text x="73" y="406" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">SDK client in this exercise</text><text x="73" y="429" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">An assistant host is separate</text><rect x="370" y="350" width="285" height="115" rx="4" fill="#f7f7f7" stroke="#777"/><text x="388" y="379" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Optional MCP server</text><text x="388" y="406" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Separate local stdio process</text><text x="388" y="429" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Four inline artifact tools</text><rect x="735" y="350" width="305" height="115" rx="4" fill="#f7f7f7" stroke="#777"/><text x="753" y="379" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Local artifacts</text><text x="753" y="406" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Synthetic inputs + reference</text><text x="753" y="429" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Drift signal + preview outputs</text><polyline points="295,407 370,407" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="392" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">stdio</text><polyline points="512,350 512,296 887,296 887,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="575" y="284" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">shared engine functions</text><polyline points="888,260 888,350" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="906" y="310" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">learner helpers</text><text x="55" y="510" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Setup downloads: public source and packages. No live telemetry or model request in the core exercises.</text><rect x="25" y="590" width="1050" height="390" rx="4" fill="white" stroke="#aaa" stroke-dasharray="8 5"/><text x="41" y="620" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">B. Proposed RHDP live extension on Red Hat OpenShift: implementation and review pending</text><rect x="55" y="655" width="240" height="95" rx="4" fill="#f7f7f7" stroke="#777" stroke-dasharray="8 5"/><text x="73" y="684" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Checkout service</text><text x="73" y="711" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Controlled sample workload</text><rect x="370" y="655" width="285" height="95" rx="4" fill="#f7f7f7" stroke="#777" stroke-dasharray="8 5"/><text x="388" y="684" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Prometheus / Thanos</text><text x="388" y="711" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Scoped telemetry read access</text><rect x="735" y="655" width="305" height="95" rx="4" fill="#f7f7f7" stroke="#777" stroke-dasharray="8 5"/><text x="753" y="684" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">SLOscope collector / API</text><text x="753" y="711" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Collect, compute, validate</text><text x="753" y="734" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Serve reviewable artifacts</text><polyline points="295,702 370,702" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="302" y="687" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">metrics</text><polyline points="655,702 735,702" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="670" y="687" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">reads</text><rect x="55" y="825" width="240" height="95" rx="4" fill="#f7f7f7" stroke="#777" stroke-dasharray="8 5"/><text x="73" y="854" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Human service owner</text><text x="73" y="881" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Reviews artifacts and action</text><text x="73" y="904" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">No automatic deployment</text><rect x="370" y="825" width="285" height="95" rx="4" fill="#f7f7f7" stroke="#777" stroke-dasharray="8 5"/><text x="388" y="854" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Artifact storage</text><text x="388" y="881" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Reference and current window</text><text x="388" y="904" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Storage / PVC qualification</text><rect x="735" y="825" width="305" height="95" rx="4" fill="#f7f7f7" stroke="#777" stroke-dasharray="8 5"/><text x="753" y="854" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Supported model endpoint</text><text x="753" y="881" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Advisory proposals / reports</text><text x="753" y="904" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Scoped server-side secrets</text><polyline points="887,750 887,825" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="905" y="792" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">request / result</text><polyline points="735,730 695,730 695,872 655,872" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="604" y="803" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">artifacts</text><polyline points="370,872 295,872" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="302" y="856" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">review</text><text x="30" y="1020" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Still to qualify: topology, learner isolation, telemetry/model permissions, TLS, API access, image digest, storage, and cleanup.</text><text x="30" y="1050" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Dashed components and connections are a delivery design, not proof of a deployed environment.</text></svg>
