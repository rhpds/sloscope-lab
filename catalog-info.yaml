metadata:
  name: sloscope-lab
  title: sloscope-lab
  description: "Hands-on SRE lab using SLOscope to collect and inspect telemetry
    evidence, compare drift against a preserved reference, review
    evidence-constrained classifications and SLO proposals, and optionally
    inspect inline artifacts through read-only MCP tools. Learners practice
    abstention and distinguish recorded examples from live acceptance. Source
    engine: https://github.com/jkershawrh/slo-sli-automation. Engineering
    tracking: INTEL-83, related to INTEL-44. Publishing House will own content
    review and AgnosticV onboarding."
